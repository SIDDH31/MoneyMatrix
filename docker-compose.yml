version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneymatrix
      POSTGRES_PASSWORD: moneymatrix_dev
      POSTGRES_DB: moneymatrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymatrix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
